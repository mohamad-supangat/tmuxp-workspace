session_name: Sekolahku x Fingerspot
start_directory: "~/projects/asd/sekolahku/aura-erp/"

windows:
  - layout: main-vertical
    panes:
      - shell_command:
          - nvim
    window_name: SekolahKU
  - layout: main-vertical
    start_directory: "~/projects/asd/sekolahku/sekolahku_fingeerspot_connector/"
    panes:
      - shell_command:
          - nvim
    window_name: Fingerspot
  - layout: main-vertical
    panes:
      - shell_command:
          - bun run dev
      - shell_command:
          - frankenphp run
      - shell_command:
          - frankenphp php-server -d fingerspot.localhost -r ~/projects/asd/sekolahku/sekolahku_fingeerspot_connector/public
    window_name: Runner
